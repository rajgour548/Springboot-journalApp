#spring.redis.port=6379
#logging.level.net.engineeringdigest.journalApp=Trace #-->logs for the level set and all level below the level set are logged trace ->  Debug -> Info -> Warn -> Error
#spring.data.mongodb.username=myusername
#spring.data.mongodb.password=mypassword

brevo.api.key=${brevo_api_key}
brevo.api.url=${brevo_api_url}
brevo.sender.email=${brevo_sender_email}
brevo.sender.name=${brevo_sender_name}

# Gemini AI mood analysis
gemini.api.key=${GEMINI_API_KEY}

spring.security.oauth2.client.registration.google.client-id=${google_oauth2_client_id}
spring.security.oauth2.client.registration.google.client-secret=${google_oauth2_client_secret}


# Kafka Config - Local Development
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=sentiment-group
spring.kafka.consumer.auto-offset-reset=earliest

# JSON Serialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=net.engineeringdigest.journalApp.entities
spring.kafka.consumer.properties.spring.json.value.default.type=net.engineeringdigest.journalApp.entities.SentimentData
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Producer timeout/retry settings
spring.kafka.producer.retries=0
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=1000

#logging configuration (lombok @slf4j logging Api,s(configure logging field log + logback implementation)
# Root logging level
logging.level.root=INFO

# Log file
logging.file.name=journalApp.log

# Console log format
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File log format
logging.pattern.file=%d{yy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Rolling file configuration
logging.logback.rollingpolicy.file-name-pattern=journalApp-%d{yyyy-MM-dd_HH-mm}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=1
logging.logback.rollingpolicy.total-size-cap=100MB

